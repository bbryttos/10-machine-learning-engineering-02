[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telco-churn-pipeline"
version = "0.1.0"
description = "Pipeline reprodutível de classificação de churn — FIAP Fase 2"
requires-python = ">=3.11,<3.13"
dependencies = [
  "bcrypt>=4,<5",
  "dvc>=3.50,<4",
  "fastapi>=0.115,<1",
  "joblib>=1.3,<2",
  "mlflow>=2.20,<4",
  "pandas>=2.1,<3",
  "pyarrow>=15,<22",
  "prometheus-client>=0.21,<1",
  "python-jose[cryptography]>=3.4,<4",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "scikit-learn>=1.4,<2",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/churn_prediction"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=churn_prediction --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["churn_prediction"]

[tool.coverage.report]
exclude_also = [
  "def main",
  "if __name__ == .__main__.:",
]
